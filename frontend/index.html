<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BrewVote — Coffee Rating App</title>
  <meta name="description" content="Vote for your favourite coffee. Each click updates the rating instantly — see which brew wins the leaderboard." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700;800&family=Inter:wght@300;400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ── HEADER ──────────────────────────────────── -->
  <header class="site-header">
    <div class="header-inner">
      <div class="brand">
        <span class="brand-cup" aria-hidden="true">☕</span>
        <div>
          <h1 class="brand-name">BrewVote</h1>
          <p class="brand-sub">Community coffee ratings</p>
        </div>
      </div>

      <!-- Stats -->
      <div class="header-stats">
        <div class="hstat">
          <span class="hstat-val" id="hTotalVotes">—</span>
          <span class="hstat-label">Total Votes</span>
        </div>
        <div class="hstat-divider" aria-hidden="true"></div>
        <div class="hstat">
          <span class="hstat-val" id="hTopCoffee">—</span>
          <span class="hstat-label">Current Leader</span>
        </div>
      </div>
    </div>

    <!-- Sort controls -->
    <div class="sort-bar" role="group" aria-label="Sort coffees">
      <span class="sort-label">Sort by:</span>
      <button class="sort-btn active" data-sort="votes" id="sortVotes">🏆 Most Voted</button>
      <button class="sort-btn" data-sort="name" id="sortName">🔤 Name</button>
      <button class="sort-btn" data-sort="newest" id="sortNewest">🆕 Newest</button>
      <button class="btn-add-coffee" id="btnAddCoffee" aria-label="Add new coffee">+ Add Coffee</button>
    </div>
  </header>

  <!-- ── LEADERBOARD PODIUM ───────────────────────── -->
  <section class="podium-section" aria-label="Top 3 coffees">
    <div class="podium" id="podium">
      <!-- Rendered by JS -->
    </div>
  </section>

  <!-- ── FULL LIST ─────────────────────────────────── -->
  <main class="main-list" aria-label="All coffees">
    <div class="list-header">
      <h2 class="list-title">All Coffees</h2>
      <span class="list-count" id="listCount"></span>
    </div>

    <!-- Skeleton loading -->
    <div class="coffee-grid" id="coffeeGrid">
      <div class="skeleton-card" aria-hidden="true"></div>
      <div class="skeleton-card" aria-hidden="true"></div>
      <div class="skeleton-card" aria-hidden="true"></div>
      <div class="skeleton-card" aria-hidden="true"></div>
    </div>

    <div class="empty-state" id="emptyState" hidden>
      <span aria-hidden="true">☕</span>
      <p>No coffees yet. Add the first one!</p>
    </div>
  </main>

  <!-- ── ADD COFFEE MODAL ──────────────────────────── -->
  <div id="addModal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="addModalTitle" hidden>
    <div class="modal-box">
      <div class="modal-header">
        <h2 id="addModalTitle">Add New Coffee</h2>
        <button class="modal-close" id="modalClose" aria-label="Close">✕</button>
      </div>
      <form id="addCoffeeForm" novalidate>
        <div class="modal-body">

          <!-- Emoji picker -->
          <div class="field">
            <label>Choose an emoji</label>
            <div class="emoji-picker" id="emojiPicker" role="radiogroup">
              <button type="button" class="emoji-btn active" data-emoji="☕" aria-pressed="true">☕</button>
              <button type="button" class="emoji-btn" data-emoji="🌿" aria-pressed="false">🌿</button>
              <button type="button" class="emoji-btn" data-emoji="⚡" aria-pressed="false">⚡</button>
              <button type="button" class="emoji-btn" data-emoji="🌑" aria-pressed="false">🌑</button>
              <button type="button" class="emoji-btn" data-emoji="🍒" aria-pressed="false">🍒</button>
              <button type="button" class="emoji-btn" data-emoji="🥜" aria-pressed="false">🥜</button>
              <button type="button" class="emoji-btn" data-emoji="🌺" aria-pressed="false">🌺</button>
              <button type="button" class="emoji-btn" data-emoji="🏔️" aria-pressed="false">🏔️</button>
            </div>
          </div>

          <div class="modal-grid">
            <div class="field span2">
              <label for="cfName">Coffee Name <span class="req">*</span></label>
              <input type="text" id="cfName" placeholder="e.g. Ethiopian Yirgacheffe" required />
              <span class="field-error" id="cfNameError"></span>
            </div>
            <div class="field">
              <label for="cfOrigin">Origin</label>
              <input type="text" id="cfOrigin" placeholder="e.g. Ethiopia" />
            </div>
            <div class="field">
              <label for="cfRoast">Roast Level</label>
              <select id="cfRoast">
                <option value="Light">☀️ Light</option>
                <option value="Medium" selected>🌤 Medium</option>
                <option value="Dark">🌑 Dark</option>
                <option value="Espresso">⚡ Espresso</option>
              </select>
            </div>
            <div class="field">
              <label for="cfPrice">Price ($)</label>
              <input type="number" id="cfPrice" placeholder="4.50" min="0" step="0.25" />
            </div>
            <div class="field span2">
              <label for="cfDesc">Description</label>
              <textarea id="cfDesc" rows="3" placeholder="Tasting notes, aroma, body…" maxlength="500"></textarea>
            </div>
          </div>

        </div>
        <div class="modal-footer">
          <button type="button" class="btn-cancel" id="btnCancel">Cancel</button>
          <button type="submit" class="btn-submit" id="btnSubmit">☕ Add Coffee</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
